<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1013" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <title>Tennispedia · Accueil</title>
  </head>
  <body data-page="accueil" class="avec-onglets">
    <header class="entete">
      <span class="point"></span>
      <h1 class="logo">TENNIS<span>PEDIA</span></h1>
    </header>
    <nav class="recherche" aria-label="Recherche">
      <form role="search">
        <label class="cache" for="recherche">Chercher un joueur ou une joueuse</label>
        <svg class="icone loupe" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input
          id="recherche"
          type="search"
          placeholder="Chercher un joueur ou une joueuse"
          autocomplete="off"
        />
      </form>
      <button class="btn-ajouter" id="ouvrir-ajout" type="button">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14" /><path d="M5 12h14" /></svg>
        <span>Ajouter<span class="cache"> un joueur</span></span>
      </button>
    </nav>
    <main class="ecran">
      <h2 class="etiquette">Populaires cette semaine</h2>
      <p id="etat" role="status"></p>
      <ol class="classement" id="liste"></ol>
      <p class="vide" id="aucun" hidden>Aucun joueur ne correspond à votre recherche.</p>
    </main>
    <dialog class="fenetre" id="fenetre-ajout" aria-labelledby="titre-ajout">
      <form id="proposer" novalidate>
        <h2 class="titre-fenetre" id="titre-ajout">Ajouter un joueur</h2>
        <label for="champ-nom">Nom du joueur</label>
        <input type="text" id="champ-nom" name="nom" autocomplete="off" />
        <label for="champ-pays">Pays</label>
        <input type="text" id="champ-pays" name="pays" autocomplete="off" />
        <p id="erreurs" aria-live="polite"></p>
        <div class="actions-fenetre">
          <button class="btn-secondaire" id="annuler-ajout" type="button">Annuler</button>
          <button class="cta" type="submit">Ajouter</button>
        </div>
      </form>
    </dialog>
    <footer class="pied"><p>© 2026 — Votre prénom</p></footer>
    <nav class="onglets" id="onglets" aria-label="Navigation principale"></nav>
  </body>
</html>
