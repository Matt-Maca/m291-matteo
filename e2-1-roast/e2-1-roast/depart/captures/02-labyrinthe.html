<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Portail</title>

<style>
    body {
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
        background: #f7f7f7;
        color: #222;
    }

    .a {
        position: absolute;
        right: 30px;
        top: 20px;
        font-size: 14px;
    }
    .a a {
        color: #555;
        text-decoration: none;
        font-weight: 500;
        transition: 0.2s;
    }
    .a a:hover {
        color: #000;
    }

    .b {
        max-width: 500px;
        margin: 120px auto 0 auto;
        text-align: center;
        padding: 20px;
    }

    .b p {
        margin: 10px 0;
    }

    .c {
        font-size: 15px;
        color: #555;
        line-height: 1.6;
    }

    .links a {
        color: #0066ff;
        text-decoration: none;
        font-weight: 500;
        margin: 0 6px;
        transition: 0.2s;
        cursor: pointer;
    }
    .links a:hover {
        color: #0033aa;
    }

    /* Message popup */
    #msg {
        margin-top: 25px;
        font-size: 15px;
        font-weight: 600;
        color: #0066ff;
        opacity: 0;
        transition: opacity 0.4s, transform 0.4s;
        transform: translateY(10px);
    }

    #msg.show {
        opacity: 1;
        transform: translateY(0);
    }
</style>
</head>

<body>

<p class="a"><a href="#">Aide?</a></p>

<div class="b">
    <p style="font-size:28px; font-weight:600;">Bienvenue</p>

    <p class="c">
        Pour continuer, allez dans Menu &gt; Espace &gt; Plus &gt; Options &gt; Avancé &gt; Liste.<br>
        Le bouton principal est quelque part.<br>
        Bonne chasse.
    </p>

    <p class="links">
        <a onclick="showMsg('menu')">menu</a> ·
        <a onclick="showMsg('espace')">espace</a> ·
        <a onclick="showMsg('plus')">plus</a>
    </p>

    <p id="msg"></p>
</div>

<script>
function showMsg(name) {
    const msg = document.getElementById("msg");
    msg.textContent = "Vous avez choisi : " + name + " — continuez la chasse 🔍";
    msg.classList.add("show");

    setTimeout(() => {
        msg.classList.remove("show");
    }, 2000);
}
</script>

</body>
</html>
