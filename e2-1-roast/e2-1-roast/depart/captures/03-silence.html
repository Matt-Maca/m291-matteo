<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer un compte</title>

<style>
    body {
        font-family: "Inter", Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: #fff;
        padding: 2rem 2.5rem;
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        width: 340px;
        text-align: center;
        position: relative;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 1.5rem;
        font-weight: 600;
        color: #222;
    }

    .field {
        text-align: left;
        margin-bottom: 1rem;
    }

    .field label {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
        color: #444;
    }

    .field input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        transition: 0.2s;
    }

    .field input:focus {
        border-color: #4a7aff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(74,122,255,0.2);
    }

    button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #4a7aff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 10px;
    }

    button:hover {
        background: #2f5ae0;
    }

    .tiny {
        margin-top: 12px;
        font-size: 11px;
        color: #999;
    }

    /* Message */
    #msg {
        position: absolute;
        bottom: -40px;
        left: 50%;
        transform: translateX(-50%);
        background: #4a7aff;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.4s, transform 0.4s;
    }

    #msg.show {
        opacity: 1;
        transform: translateX(-50%) translateY(-6px);
    }
</style>
</head>

<body>

<div class="card">
    <h1>Créer un compte</h1>

    <div class="field">
        <label>Email</label>
        <input type="email">
    </div>

    <div class="field">
        <label>Mot de passe</label>
        <input type="password">
    </div>

    <button type="button" id="x">Créer mon compte</button>

    <p class="tiny">En cliquant, vous acceptez tout.</p>

    <div id="msg">C’est beau ✨</div>
</div>

<script>
document.getElementById("x").onclick = function() {
    const msg = document.getElementById("msg");
    msg.classList.add("show");

    setTimeout(() => {
        msg.classList.remove("show");
    }, 1800);
};
</script>

</body>
</html>
