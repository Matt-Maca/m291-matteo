<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Composant Autocomplétion Accessible — ICT 291</title>
  <style>
    :root {
      --color-primary: #0284c7;
      --color-border: #cbd5e1;
      --color-bg-hover: #f1f5f9;
      --font-sans: system-ui, sans-serif;
    }
    body { font-family: var(--font-sans); padding: 2rem; }
    .combobox-wrapper { position: relative; max-width: 400px; }
    .combobox-label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    .combobox-input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 1rem; border: 1px solid var(--color-border); border-radius: 6px; }
    .combobox-input:focus-visible { outline: 2px solid var(--color-primary); }
    .suggestions-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--color-border); border-radius: 6px; margin-top: 4px; padding: 0; list-style: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 240px; overflow-y: auto; z-index: 10; }
    .suggestion-item { padding: 10px 12px; cursor: pointer; }
    .suggestion-item[aria-selected="true"], .suggestion-item:hover { background-color: var(--color-bg-hover); color: var(--color-primary); font-weight: 600; }
  </style>
</head>
<body>
  <h1>Recherche de communes suisses</h1>
  <div class="combobox-wrapper" id="recherche-combobox">
    <label for="recherche-input" class="combobox-label">Rechercher une destination :</label>
    <input
      type="text"
      id="recherche-input"
      role="combobox"
      aria-expanded="false"
      aria-autocomplete="list"
      aria-controls="suggestions-list"
      autocomplete="off"
      class="combobox-input"
      placeholder="Ex: Lausanne, Vevey, Montreux..."
    >
    <ul id="suggestions-list" role="listbox" class="suggestions-list" hidden></ul>
  </div>

  <script>
    const villes = [
      "Aigle", "Bulle", "Château-d'Œx", "Fribourg", "Genève", "Grandson",
      "La Chaux-de-Fonds", "Lausanne", "Montreux", "Morges", "Neuchâtel",
      "Nyon", "Payerne", "Sion", "Vevey", "Yverdon-les-Bains"
    ];

    const input = document.getElementById("recherche-input");
    const listbox = document.getElementById("suggestions-list");
    let activeIndex = -1;
    let resultats = [];

    // Ouvre / ferme la liste (aria-expanded)
    function ouvrir() {
      listbox.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }
    function fermer() {
      listbox.hidden = true;
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
      activeIndex = -1;
    }

    // Marque l'élément actif (index + aria-selected)
    function definirActif(index) {
      const items = listbox.querySelectorAll("li");
      items.forEach(li => li.setAttribute("aria-selected", "false"));
      activeIndex = index;
      if (items[index]) {
        items[index].setAttribute("aria-selected", "true");
        input.setAttribute("aria-activedescendant", items[index].id);
      }
    }

    // Filtre et affiche les suggestions
    input.addEventListener("input", () => {
      const saisie = input.value.trim().toLowerCase();
      listbox.innerHTML = "";
      activeIndex = -1;
      if (!saisie) { fermer(); return; }

      resultats = villes.filter(v => v.toLowerCase().includes(saisie));
      resultats.forEach((ville, i) => {
        const li = document.createElement("li");
        li.id = "option-" + i;
        li.className = "suggestion-item";
        li.setAttribute("role", "option");
        li.setAttribute("aria-selected", "false");
        li.textContent = ville;
        li.addEventListener("mousedown", () => { input.value = ville; fermer(); });
        listbox.appendChild(li);
      });
      if (resultats.length) { ouvrir(); } else { fermer(); }
    });

    // Clavier : flèches, Entrée, Échap
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (resultats.length) definirActif(Math.min(activeIndex + 1, resultats.length - 1));
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (resultats.length) definirActif(Math.max(activeIndex - 1, 0));
      } else if (e.key === "Enter" && activeIndex >= 0) {
        e.preventDefault();
        input.value = resultats[activeIndex];
        fermer();
      } else if (e.key === "Escape") {
        fermer();
      }
    });
  </script>
</body>
</html>
